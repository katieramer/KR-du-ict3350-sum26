<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Color Palette</title>
    <link rel="stylesheet" href="../css/main.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
      body { font-family: Arial, sans-serif; padding: 16px; }
      .palette-maker { max-width: 420px; }
      .color-options input { margin: 6px 6px 12px 0; width: 48px; height: 34px; }
      #palette-preview { display: flex; gap: 8px; margin-top: 12px; }
      .swatch { width: 80px; height: 80px; border-radius: 6px; display:flex; align-items:flex-end; padding:6px; color: #fff; font-weight:600; box-shadow: 0 1px 2px rgba(0,0,0,.15); }
      .swatch code { background: rgba(0,0,0,.25); padding: 2px 6px; border-radius:4px; font-weight:600; font-size:12px; }
    </style>
  </head>
  <body>
    <section class="palette-maker">
      <h2>Color Palette Template Maker</h2>
      <p>Select colors for your content palette.</p>

      <div class="color-options">
        <input type="color" id="color-one" value="#f6bd60">
        <input type="color" id="color-two" value="#f7ede2">
        <input type="color" id="color-three" value="#84a59d">
        <input type="color" id="color-four" value="#f28482">
      </div>

      <button id="create-palette">Create Palette</button>

      <div id="palette-preview" aria-live="polite"></div>
    </section>

    <script>
      function makeSwatch(hex) {
        console.log("Creating swatch:", hex);
        const $s = $('<div>').addClass('swatch').css('background-color', hex);
        const $label = $('<code>').text(hex.toUpperCase());
        $s.append($label);
        // adjust text color for contrast
        const luma = parseInt(hex.slice(1,3),16)*0.299 + parseInt(hex.slice(3,5),16)*0.587 + parseInt(hex.slice(5,7),16)*0.114;
        if (luma > 200) $s.css('color', '#222');
        return $s;
      }

      function buildPalette() {
        const colors = [
          $('#color-one').val(),
          $('#color-two').val(),
          $('#color-three').val(),
          $('#color-four').val()
        ];
        const $preview = $('#palette-preview').empty();
        colors.forEach(c => $preview.append(makeSwatch(c)));
      }console.log("Palette created successfully.");


      $(function(){
        $('#create-palette').on('click', buildPalette);
        // build initial preview
        buildPalette();
      });
    </script>
  </body>
</html>
